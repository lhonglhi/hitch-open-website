<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 号楼 · 连续对打纪录榜 | Hitch Open</title>

    <!-- 内部页面：无站内入口, 只能直接输地址进入。
         用 noindex 而不是 robots.txt 挡: robots.txt 是公开的, 写进去等于
         广播这个地址; 而且被 Disallow 的页面爬虫不会读取, 也就看不到 noindex。 -->
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png">
    <link rel="shortcut icon" href="images/favicon.png">
    <link rel="apple-touch-icon" sizes="256x256" href="images/webclip.png">

    <!-- 自包含样式。不加载 css/style.css，那是为深色站写的, 这里是亮色页。
         .htaccess 对 css/js 是 1 年 immutable 缓存, 所以必须带 ?v= -->
    <link rel="stylesheet" href="css/building8.css?v=20261006h">
</head>

<body>

    <header class="b8-header">
        <div class="b8-header-inner">
            <a href="hope.html"><img src="images/160x160-logo.png" alt="HITCH OPEN"></a>
            <div class="b8-header-tools">
                <!-- 运营工具收在顶栏: localStorage 会被「清除浏览数据」抹掉,
                     导出是唯一兜底; 导出的 JSON 可直接提交进仓库备份。
                     放这里是为了不占 16:9 看板的正文版面。 -->
                <button type="button" class="b8-tool" onclick="b8Export()"
                        data-zh="导出备份" data-en="Export">导出备份</button>
                <button type="button" class="b8-tool" onclick="document.getElementById('b8File').click()"
                        data-zh="导入备份" data-en="Import">导入备份</button>
                <input type="file" id="b8File" accept="application/json,.json" hidden onchange="b8ImportFile(this)">
                <div class="b8-lang">
                    <button type="button" onclick="b8SetLang('zh')">中文</button>
                    <span>/</span>
                    <button type="button" onclick="b8SetLang('en')">EN</button>
                </div>
            </div>
        </div>
    </header>

    <div class="b8-head">
        <h1 data-zh="8 号楼 · 连续对打纪录榜" data-en="Building 8 · Rally Record Board">8 号楼 · 连续对打纪录榜</h1>
        <!-- 两个榜都用这句, 所以不能再写「与机器人对打」 -->
        <p data-zh="连续对打不失误，一拍记 1 分。" data-en="Rally without a miss. One stroke, one point.">连续对打不失误，一拍记 1 分。</p>
    </div>

    <!-- 两个榜左右并排。cat=hr 人对机器人(左), cat=rr 机器人对机器人(右)。
         记录存在同一个数组里, 由 cat 字段区分。 -->
    <main class="b8-boards">
        <section class="b8-board" data-cat="hr">
            <div class="b8-board-head">
                <span class="b8-vs-icon"><svg viewBox="0 0 68 32" fill="currentColor" aria-hidden="true" focusable="false"><circle cx="15" cy="9" r="7.5"/><path d="M15 19c-8 0-13.5 6-13.5 13h27C28.5 25 23 19 15 19z"/><circle cx="53" cy="1.8" r="1.8"/><rect x="52" y="3" width="2" height="3.5"/><rect x="43.5" y="6" width="19" height="13" rx="2.5"/><rect x="50.5" y="18.5" width="5" height="3.5"/><rect x="41" y="21.5" width="24" height="10.5" rx="2"/></svg></span>
                <h2 data-zh="人 VS 机器人" data-en="Human VS Robot">人 VS 机器人</h2>
                <span class="b8-count" id="b8Count-hr"></span>
                <button type="button" class="b8-add" onclick="b8OpenForm(null,'hr')"
                        data-zh-title="添加纪录" data-en-title="Add a record"
                        aria-label="添加纪录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg></button>
            </div>
            <ul class="b8-list" id="b8List-hr"></ul>
        </section>

        <section class="b8-board" data-cat="rr">
            <div class="b8-board-head">
                <span class="b8-vs-icon"><svg viewBox="0 0 68 32" fill="currentColor" aria-hidden="true" focusable="false"><circle cx="15" cy="1.8" r="1.8"/><rect x="14" y="3" width="2" height="3.5"/><rect x="5.5" y="6" width="19" height="13" rx="2.5"/><rect x="12.5" y="18.5" width="5" height="3.5"/><rect x="3" y="21.5" width="24" height="10.5" rx="2"/><circle cx="53" cy="1.8" r="1.8"/><rect x="52" y="3" width="2" height="3.5"/><rect x="43.5" y="6" width="19" height="13" rx="2.5"/><rect x="50.5" y="18.5" width="5" height="3.5"/><rect x="41" y="21.5" width="24" height="10.5" rx="2"/></svg></span>
                <h2 data-zh="机器人 VS 机器人" data-en="Robot VS Robot">机器人 VS 机器人</h2>
                <span class="b8-count" id="b8Count-rr"></span>
                <button type="button" class="b8-add" onclick="b8OpenForm(null,'rr')"
                        data-zh-title="添加纪录" data-en-title="Add a record"
                        aria-label="添加纪录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg></button>
            </div>
            <ul class="b8-list" id="b8List-rr"></ul>
        </section>
    </main>


    <!-- 添加 / 修改纪录 -->
    <div class="b8-modal" id="b8Modal" role="dialog" aria-modal="true" aria-labelledby="b8FormTitle">
        <div class="b8-modal-card">
            <button type="button" class="b8-close" onclick="b8CloseForm()" aria-label="Close">&times;</button>
            <h2 id="b8FormTitle">添加纪录</h2>
            <p class="b8-modal-cat" id="b8FormCat"></p>

            <form onsubmit="b8Submit(event)">
                <div class="b8-field">
                    <!-- 标签与占位文案由 b8ApplyFormCat() 按所属的榜切换,
                         所以这里不挂 data-zh/data-en, 避免语言切换时被覆盖回去 -->
                    <label for="b8Name" id="b8NameLabel">名字</label>
                    <input type="text" id="b8Name" maxlength="28" autocomplete="off">
                </div>

                <div class="b8-field">
                    <label data-zh="头像" data-en="Avatar">头像</label>
                    <div id="b8Picker"></div>
                </div>

                <div class="b8-field">
                    <label for="b8Score" data-zh="连续拍数" data-en="Rallies">连续拍数</label>
                    <input type="number" id="b8Score" min="1" step="1" inputmode="numeric"
                           data-zh-ph="例如 24" data-en-ph="e.g. 24">
                    <p class="b8-hint" data-zh="一拍记 1 分，填连续打了多少拍。"
                       data-en="One stroke counts as one point. Enter how many strokes in a row.">一拍记 1 分，填连续打了多少拍。</p>
                </div>

                <p class="b8-error" id="b8Error"></p>

                <div class="b8-actions">
                    <button type="button" class="b8-btn b8-btn-ghost" onclick="b8CloseForm()"
                            data-zh="取消" data-en="Cancel">取消</button>
                    <button type="submit" class="b8-btn b8-btn-primary"
                            data-zh="保存" data-en="Save">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/building8.js?v=20261006h"></script>
</body>

</html>
