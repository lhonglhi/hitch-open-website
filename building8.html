<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 号楼 · 连续对打纪录榜 | Hitch Open</title>

    <!-- 内部页面：无站内入口, 只能直接输地址进入。
         用 noindex 而不是 robots.txt 挡: robots.txt 是公开的, 写进去等于
         广播这个地址; 而且被 Disallow 的页面爬虫不会读取, 也就看不到 noindex。 -->
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png">
    <link rel="shortcut icon" href="images/favicon.png">
    <link rel="apple-touch-icon" sizes="256x256" href="images/webclip.png">

    <!-- 自包含样式。不加载 css/style.css，那是为深色站写的, 这里是亮色页。
         .htaccess 对 css/js 是 1 年 immutable 缓存, 所以必须带 ?v= -->
    <!-- 必须在样式表之前执行: 否则会先按浅色、无背景视频画一帧,
         深色模式下白闪一下, 开了视频则会看到前景字的颜色跳一次。 -->
    <script>
        try {
            var t = localStorage.getItem('b8_theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

            // 背景视频默认开。只有两种情况默认关: 用户明确关过,
            // 或系统设了「减少动态效果」。
            var v = localStorage.getItem('b8_video');
            var calm = window.matchMedia
                && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (v === 'on' || (v === null && !calm)) {
                document.documentElement.classList.add('b8-video-on');
            }
        } catch (e) { /* 隐私模式下忽略 */ }
    </script>

    <link rel="stylesheet" href="css/building8.css?v=20261009b">
</head>

<body>

    <!-- 背景: 深色渐变底(由 CSS 画) + 右侧这段抠像机器人动画。
         素材是 3D 渲染的透明背景动画, 两种封装都带 alpha:
           webm  VP9+alpha  Chrome / Firefox / Edge 走这个
           mp4   HEVC+alpha Safari 走这个(Chrome 不支持带 alpha 的 HEVC)
         顺序不能反 —— Safari 两个都认, 但 webm 里的 VP9 它解不了 alpha,
         所以必须把 mp4 放前面让 Safari 先命中。Chrome 不认 hvc1,
         会自动跳到 webm。
         两头各做了 0.5s 的 alpha 淡入淡出, 循环时不会硬跳。
         muted + playsinline 是自动播放的硬条件; 首帧本来就是全透明,
         所以不需要 poster。这一层纯气氛, 不承载信息, 故 aria-hidden。 -->
    <div class="b8-bg" aria-hidden="true">
        <video autoplay muted loop playsinline preload="auto">
            <source src="video/b8-robot.mp4?v=20261009b" type="video/mp4; codecs=hvc1">
            <source src="video/b8-robot.webm?v=20261009b" type="video/webm">
        </video>
    </div>

    <header class="b8-header">
        <div class="b8-header-inner">
            <a href="hope.html"><img src="images/160x160-logo.png" alt="HITCH OPEN"></a>
            <div class="b8-header-tools">
                <!-- 导出/导入与配色都收进这个齿轮里: 看板上以展示为主,
                     这些都是布置现场时才用一次的动作, 不该常驻在顶栏。
                     localStorage 会被「清除浏览数据」抹掉, 导出是唯一兜底;
                     导出的 JSON 可直接提交进仓库备份。 -->
                <div class="b8-menu-wrap">
                    <button type="button" class="b8-icon-tool" id="b8SettingsBtn"
                            onclick="b8ToggleMenu(event)" aria-haspopup="true" aria-expanded="false"
                            data-zh-title="设置" data-en-title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>

                    <div class="b8-menu" id="b8Menu" role="menu">
                        <span class="b8-menu-label" data-zh="外观" data-en="Appearance">外观</span>
                        <div class="b8-seg">
                            <button type="button" data-theme-opt="light" onclick="b8SetTheme('light')"
                                    data-zh="浅色" data-en="Light">浅色</button>
                            <button type="button" data-theme-opt="dark" onclick="b8SetTheme('dark')"
                                    data-zh="深色" data-en="Dark">深色</button>
                        </div>
                        <span class="b8-menu-label" data-zh="背景动画" data-en="Background">背景动画</span>
                        <div class="b8-seg">
                            <button type="button" data-video-opt="on" onclick="b8SetVideo('on')"
                                    data-zh="开" data-en="On">开</button>
                            <button type="button" data-video-opt="off" onclick="b8SetVideo('off')"
                                    data-zh="关" data-en="Off">关</button>
                        </div>
                        <div class="b8-menu-sep"></div>
                        <button type="button" class="b8-menu-item" onclick="b8Export()"
                                data-zh="导出备份" data-en="Export backup">导出备份</button>
                        <button type="button" class="b8-menu-item"
                                onclick="document.getElementById('b8File').click()"
                                data-zh="导入备份" data-en="Import backup">导入备份</button>
                    </div>
                </div>
                <input type="file" id="b8File" accept="application/json,.json" hidden onchange="b8ImportFile(this)">
                <div class="b8-lang">
                    <button type="button" onclick="b8SetLang('zh')">中文</button>
                    <span>/</span>
                    <button type="button" onclick="b8SetLang('en')">EN</button>
                </div>
            </div>
        </div>
    </header>

    <div class="b8-head">
        <h1 data-zh="8 号楼 · 连续对打纪录榜" data-en="Building 8 · Rally Record Board">8 号楼 · 连续对打纪录榜</h1>
        <!-- 两个榜都用这句, 所以不能再写「与机器人对打」 -->
        <p data-zh="连续对打不失误，一拍记 1 分。" data-en="Rally without a miss. One stroke, one point.">连续对打不失误，一拍记 1 分。</p>
    </div>

    <!-- 两个榜: cat=hr 人对机器人, cat=rr 机器人对机器人。
         记录存在同一个数组里, 由 cat 字段区分。
         大屏上两个榜叠在一起每 8 秒轮换, 窄屏/竖屏则上下都显示。
         aria-hidden 由 js 的轮播逻辑维护, 窄屏下会被清回 false。 -->
    <main class="b8-boards">
        <section class="b8-board" data-cat="hr" aria-hidden="false">
            <div class="b8-board-head">
                <span class="b8-vs-icon"><svg viewBox="0 0 68 32" fill="currentColor" aria-hidden="true" focusable="false"><circle cx="15" cy="9" r="7.5"/><path d="M15 19c-8 0-13.5 6-13.5 13h27C28.5 25 23 19 15 19z"/><circle cx="53" cy="1.8" r="1.8"/><rect x="52" y="3" width="2" height="3.5"/><rect x="43.5" y="6" width="19" height="13" rx="2.5"/><rect x="50.5" y="18.5" width="5" height="3.5"/><rect x="41" y="21.5" width="24" height="10.5" rx="2"/></svg></span>
                <h2 data-zh="人 VS 机器人" data-en="Human VS Robot">人 VS 机器人</h2>
                <span class="b8-count" id="b8Count-hr"></span>
                <button type="button" class="b8-add" onclick="b8OpenForm(null,'hr')"
                        data-zh-title="添加纪录" data-en-title="Add a record"
                        aria-label="添加纪录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg></button>
            </div>
            <ul class="b8-list" id="b8List-hr"></ul>
        </section>

        <section class="b8-board" data-cat="rr" aria-hidden="false">
            <div class="b8-board-head">
                <span class="b8-vs-icon"><svg viewBox="0 0 68 32" fill="currentColor" aria-hidden="true" focusable="false"><circle cx="15" cy="1.8" r="1.8"/><rect x="14" y="3" width="2" height="3.5"/><rect x="5.5" y="6" width="19" height="13" rx="2.5"/><rect x="12.5" y="18.5" width="5" height="3.5"/><rect x="3" y="21.5" width="24" height="10.5" rx="2"/><circle cx="53" cy="1.8" r="1.8"/><rect x="52" y="3" width="2" height="3.5"/><rect x="43.5" y="6" width="19" height="13" rx="2.5"/><rect x="50.5" y="18.5" width="5" height="3.5"/><rect x="41" y="21.5" width="24" height="10.5" rx="2"/></svg></span>
                <h2 data-zh="机器人 VS 机器人" data-en="Robot VS Robot">机器人 VS 机器人</h2>
                <span class="b8-count" id="b8Count-rr"></span>
                <button type="button" class="b8-add" onclick="b8OpenForm(null,'rr')"
                        data-zh-title="添加纪录" data-en-title="Add a record"
                        aria-label="添加纪录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg></button>
            </div>
            <ul class="b8-list" id="b8List-rr"></ul>
        </section>
    </main>

    <!-- 轮播指示条。只在大屏轮播时出现(由 CSS 断点控制显隐)。
         两个胶囊都是真按钮: 点一下立刻切到那个榜并重新计时,
         不是只会亮一下的装饰。文字由 js 按 B8_CATS 填, 省得两处对不上。 -->
    <nav class="b8-rotator" id="b8Rotator" role="tablist"
         data-zh-label="切换排行榜" data-en-label="Switch board"></nav>


    <!-- 添加 / 修改纪录 -->
    <div class="b8-modal" id="b8Modal" role="dialog" aria-modal="true" aria-labelledby="b8FormTitle">
        <div class="b8-modal-card">
            <button type="button" class="b8-close" onclick="b8CloseForm()" aria-label="Close">&times;</button>
            <h2 id="b8FormTitle">添加纪录</h2>
            <p class="b8-modal-cat" id="b8FormCat"></p>

            <form onsubmit="b8Submit(event)">
                <div class="b8-field">
                    <!-- 标签与占位文案由 b8ApplyFormCat() 按所属的榜切换,
                         所以这里不挂 data-zh/data-en, 避免语言切换时被覆盖回去 -->
                    <label for="b8Name" id="b8NameLabel">名字</label>
                    <input type="text" id="b8Name" maxlength="28" autocomplete="off">
                </div>

                <div class="b8-field">
                    <label data-zh="头像" data-en="Avatar">头像</label>
                    <div id="b8Picker"></div>
                </div>

                <div class="b8-field">
                    <label for="b8Score" data-zh="连续拍数" data-en="Rallies">连续拍数</label>
                    <input type="number" id="b8Score" min="1" step="1" inputmode="numeric"
                           data-zh-ph="例如 24" data-en-ph="e.g. 24">
                    <p class="b8-hint" data-zh="一拍记 1 分，填连续打了多少拍。"
                       data-en="One stroke counts as one point. Enter how many strokes in a row.">一拍记 1 分，填连续打了多少拍。</p>
                </div>

                <p class="b8-error" id="b8Error"></p>

                <div class="b8-actions">
                    <button type="button" class="b8-btn b8-btn-ghost" onclick="b8CloseForm()"
                            data-zh="取消" data-en="Cancel">取消</button>
                    <button type="submit" class="b8-btn b8-btn-primary"
                            data-zh="保存" data-en="Save">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/building8.js?v=20261009b"></script>
</body>

</html>
